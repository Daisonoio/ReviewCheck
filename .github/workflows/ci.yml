name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      # Cache restored packages to cut CI latency on repeat runs.
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Restore
        run: dotnet restore ReviewCheck.sln
      - name: Build
        run: dotnet build ReviewCheck.sln --configuration Release --no-restore
      - name: Test
        run: >
          dotnet test ReviewCheck.sln --configuration Release --no-build --verbosity normal
          --collect:"XPlat Code Coverage" --results-directory ./coverage
      # Informational only — no threshold gate yet, just visibility into what the 171 tests actually
      # exercise. Coverlet.collector is already a test-project dependency; this just turns it on.
      - name: Upload code coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: code-coverage
          path: coverage/**/coverage.cobertura.xml

  capability-evals:
    # Treat the agent-capability guardrails (grounding, no-verdict, degradation, …) as a gate:
    # a capability regression fails the build, exactly like a failing test.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Run capability eval suite
        run: dotnet run --project eval/ReviewCheck.Evals/ReviewCheck.Evals.csproj -c Release
      - name: Upload capability scorecard
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-report
          path: eval-report.json
